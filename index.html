<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Node Portal Prototyping</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #07070c; }
        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .corner-brand { position: absolute; top: 25px; left: 25px; z-index: 3; display: flex; align-items: center; gap: 10px; }
        .brand-logo-node { width: 35px; height: 35px; background: linear-gradient(135deg, #ff9900, #ff5500); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 18px; box-shadow: 0 0 10px rgba(255, 153, 0, 0.4); }
        .brand-text { color: #ffffff; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
        .login-card-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; background: rgba(15, 15, 25, 0.9); padding: 40px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); width: 340px; text-align: center; backdrop-filter: blur(8px); }
        .login-card-wrapper h2 { color: #fff; font-size: 20px; margin-bottom: 25px; }
        input[type="password"] { width: 100%; padding: 12px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; color: #fff; font-size: 15px; outline: none; }
        input[type="password"]:focus { border-color: #ff9900; }
        button { width: 100%; padding: 12px; background: #ff9900; border: none; color: #000; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #e08800; }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="corner-brand">
        <div class="brand-logo-node">Ω</div>
        <div class="brand-text">PLATFORM CORE SYSTEM</div>
    </div>
    <div class="login-card-wrapper">
        <h2>Enter Credentials</h2>
        <input type="password" id="inputPass" placeholder="Password">
        <button id="loginBtn">SUBMIT</button>
    </div>
    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let elements = [];
        function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', initCanvas);
        initCanvas();
        class DigitalStream {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.speed = Math.random() * 1 + 0.5;
                this.value = Math.floor(Math.random() * 2);
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) { this.y = 0; this.x = Math.random() * canvas.width; }
            }
            draw() { ctx.fillStyle = 'rgba(255, 153, 0, 0.15)'; ctx.font = '12px monospace'; ctx.fillText(this.value, this.x, this.y); }
        }
        for (let i = 0; i < 40; i++) elements.push(new DigitalStream());
        function run() {
            ctx.fillStyle = 'rgba(7, 7, 12, 0.1)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            elements.forEach(el => { el.update(); el.draw(); });
            requestAnimationFrame(run);
        }
        run();
    </script>
</body>
</html>
